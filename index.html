<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Food Delivery TMA</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js?v=cheese"></script>
  <script src="supabase.js?v=cheese"></script>

  <style>
    * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    
    /* 🧀 ГЛОБАЛЬНАЯ СЫРНАЯ ТЕМА */
    body {
      background-color: #F5EEE2 !important; /* Теплый матовый лаваш */
      color: #2B1810 !important;
    }
    
    /* Превращаем все белые карточки в теплый сырный крем */
    .bg-white, #cart-drawer, header, nav {
      background-color: #FFFDF9 !important;
      border-color: #EADBC8 !important;
    }
    
    /* Внутренние плашки (поля ввода, добавки) */
    .bg-slate-50, input, select {
      background-color: #FAF3E8 !important;
      border-color: #E2D3BE !important;
      color: #2B1810 !important;
    }
    
    /* Кнопки "+ В корзину" и бейджи */
    .bg-slate-100 {
      background-color: #F1E3CF !important;
      color: #3D2216 !important;
    }
    
    /* Главные черные кнопки -> цвет поджаренной корочки */
    .bg-slate-900, #submit-order-btn {
      background-color: #2E1A11 !important;
      color: #FFF8EE !important;
    }
    
    /* Все серые границы делаем теплыми */
    .border-slate-100, .border-slate-200 {
      border-color: #EADBC8 !important;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="pb-24 antialiased selection:bg-none">

  <!-- Шапка в цвете топленого сыра -->
  <header class="sticky top-0 z-30 bg-[#FFFDF9]/95 backdrop-blur-md border-b border-[#E8DCCB] px-4 py-3 shadow-sm flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-2xl bg-amber-100/70 border border-amber-200 text-amber-800 flex items-center justify-center text-2xl shadow-inner" id="brand-logo">
        🥙
      </div>
      <div>
        <h1 class="text-base font-black tracking-tight text-[#2D1A12] leading-tight" id="brand-name">ЗАВЕДЕНИЕ</h1>
        <p class="text-xs text-[#8A7165] font-medium" id="brand-subtitle">Заказ еды</p>
      </div>
    </div>
    
    <div id="status-badge-container">
      <span id="status-badge" class="text-xs font-bold px-2.5 py-1 rounded-full bg-amber-50 text-amber-800 border border-amber-200">
        Проверка времени...
      </span>
    </div>
  </header>

  <main class="p-4 max-w-lg mx-auto">
    
    <!-- 1. ВКЛАДКА: МЕНЮ -->
    <section id="tab-menu" class="space-y-4">
      
      <!-- Категории -->
      <div id="categories-bar" class="flex gap-2 overflow-x-auto no-scrollbar pb-1"></div>

      <!-- Список блюд -->
      <div id="menu-container" class="space-y-3">
        <p class="text-center text-sm text-[#8A7165] py-10">Разогреваем печь...</p>
      </div>

      <!-- Корзина -->
      <div id="cart-drawer" class="hidden bg-[#FFFDF9] border border-[#E8DCCB] rounded-3xl p-5 shadow-xl space-y-4 mt-6">
        <div class="flex justify-between items-center border-b border-[#F0E4D3] pb-2">
          <h3 class="font-extrabold text-base text-[#2D1A12]">🛒 Ваш заказ</h3>
          <button type="button" onclick="clearCart()" class="text-xs text-rose-600 font-bold">Очистить</button>
        </div>
        
        <div id="cart-items" class="space-y-3"></div>

        <div class="border-t border-[#F0E4D3] pt-3 space-y-3">
          <div id="order-type-selector">
            <label class="block text-xs font-bold text-[#8A7165] mb-1.5 uppercase">Тип получения</label>
            <div class="grid grid-cols-2 gap-2" id="order-type-buttons"></div>
          </div>

          <div>
            <label class="block text-xs font-bold text-[#8A7165] mb-1 uppercase">Телефон для связи</label>
            <input type="tel" id="order-phone" placeholder="+375 / +7 (___) ___-__-__" class="w-full bg-[#FAF5EE] border border-[#E2D5C3] rounded-xl px-3 py-2.5 text-sm font-semibold text-[#2D1A12] focus:outline-none focus:border-amber-600">
          </div>

          <div id="address-block" class="hidden">
            <label class="block text-xs font-bold text-[#8A7165] mb-1 uppercase">Адрес доставки</label>
            <input type="text" id="order-address" placeholder="Улица, дом, квартира / офис" class="w-full bg-[#FAF5EE] border border-[#E2D5C3] rounded-xl px-3 py-2.5 text-sm font-semibold text-[#2D1A12] focus:outline-none focus:border-amber-600">
          </div>

          <div id="pickup-time-block">
            <label class="block text-xs font-bold text-[#8A7165] mb-1 uppercase">Когда заберете?</label>
            <select id="order-time" class="w-full bg-[#FAF5EE] border border-[#E2D5C3] rounded-xl px-3 py-2.5 text-sm font-semibold text-[#2D1A12]">
              <option value="15">Через 15 минут</option>
              <option value="20" selected>Через 20 минут</option>
              <option value="30">Через 30 минут</option>
              <option value="45">Через 45 минут</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-[#8A7165] mb-1 uppercase">Способ оплаты</label>
            <select id="order-payment" class="w-full bg-[#FAF5EE] border border-[#E2D5C3] rounded-xl px-3 py-2.5 text-sm font-semibold text-[#2D1A12]">
              <option value="Наличные">Наличными при получении</option>
              <option value="Карта">Картой при получении</option>
            </select>
          </div>

          <div class="flex justify-between items-center pt-2">
            <span class="text-sm font-bold text-[#8A7165]">К оплате:</span>
            <span class="text-xl font-black text-[#2D1A12]" id="cart-total-price">0</span>
          </div>

          <button type="button" id="submit-order-btn" onclick="submitOrder()" class="w-full bg-[#2E1A11] text-amber-100 font-black py-3.5 rounded-2xl shadow-lg active:scale-95 transition-transform hover:bg-[#3D2317]">
            Оформить заказ
          </button>
        </div>
      </div>
    </section>

    <!-- 2. ВКЛАДКА: МОИ ЗАКАЗЫ -->
    <section id="tab-orders" class="hidden space-y-3">
      <h2 class="text-lg font-black text-[#2D1A12] mb-3">Мои заказы</h2>
      <div id="my-orders-list" class="space-y-3"></div>
    </section>

    <!-- 3. ВКЛАДКА: КУХНЯ -->
    <section id="tab-kitchen" class="hidden space-y-4">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-lg font-black text-[#2D1A12]">👨‍🍳 Экран кухни</h2>
        <span class="text-xs bg-amber-200/80 text-amber-900 font-bold px-2 py-1 rounded-lg" id="active-orders-count">0 активных</span>
      </div>
      <div id="kitchen-orders-list" class="space-y-3"></div>
    </section>

    <!-- 4. ВКЛАДКА: КАССА -->
    <section id="tab-admin" class="hidden space-y-4">
      <h2 class="text-lg font-black text-[#2D1A12]">📊 Касса за сегодня</h2>
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-[#FFFDF9] p-4 rounded-2xl border border-[#E8DCCB] shadow-sm">
          <p class="text-xs font-semibold text-[#8A7165]">Выручка сегодня</p>
          <p class="text-2xl font-black text-amber-700 mt-1" id="stat-revenue">0</p>
        </div>
        <div class="bg-[#FFFDF9] p-4 rounded-2xl border border-[#E8DCCB] shadow-sm">
          <p class="text-xs font-semibold text-[#8A7165]">Заказов сегодня</p>
          <p class="text-2xl font-black text-[#2D1A12] mt-1" id="stat-count">0</p>
        </div>
      </div>

      <div class="bg-[#FFFDF9] rounded-2xl p-4 border border-[#E8DCCB] shadow-sm space-y-3">
        <h3 class="font-bold text-sm text-[#2D1A12]">📋 Последние чеки</h3>
        <div id="admin-recent-orders" class="space-y-2 text-xs"></div>
      </div>
    </section>

  </main>

  <!-- Навбар в уютных тонах -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-[#FFFDF9]/95 backdrop-blur-md border-t border-[#E8DCCB] px-4 py-2 flex justify-around items-center max-w-lg mx-auto">
    <button type="button" onclick="switchTab('menu')" id="nav-btn-menu" class="flex flex-col items-center py-1 text-[#2D1A12] font-bold text-xs">
      <span class="text-xl">🥙</span>
      <span>Меню</span>
    </button>
    <button type="button" onclick="switchTab('orders')" id="nav-btn-orders" class="flex flex-col items-center py-1 text-[#A89689] font-semibold text-xs">
      <span class="text-xl">📦</span>
      <span>Заказы</span>
    </button>
    <button type="button" onclick="switchTab('kitchen')" id="nav-btn-kitchen" class="hidden flex flex-col items-center py-1 text-amber-700 font-semibold text-xs">
      <span class="text-xl">👨‍🍳</span>
      <span>Кухня</span>
    </button>
    <button type="button" onclick="switchTab('admin')" id="nav-btn-admin" class="hidden flex flex-col items-center py-1 text-[#6D4C41] font-semibold text-xs">
      <span class="text-xl">📊</span>
      <span>Касса</span>
    </button>
  </nav>

  <script src="app.js?v=cheese"></script>
</body>
</html>
